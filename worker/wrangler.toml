name = "know-your-world-api"
main = "src/index.ts"
compatibility_date = "2024-10-11"
compatibility_flags = ["nodejs_compat"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "know-your-world-db"
database_id = "38e91632-8e07-4c27-8bd9-4ee78ae30812"

# Workers AI binding — used as TTS fallback when ElevenLabs is unavailable
[ai]
binding = "AI"

# Observability
[observability]
enabled = true

# Vars (non-secret)
[vars]
CORS_ORIGIN = "https://know-your-world.vercel.app"
LEADERBOARD_LIMIT = "10"
MAX_NAME_LENGTH = "20"
# TTS rate limiting (requests per IP per minute)
TTS_RATE_LIMIT = "20"
# TTS cache TTL in seconds (30 days)
TTS_CACHE_TTL = "2592000"
# Max text length for TTS
TTS_MAX_TEXT_LENGTH = "500"
# C1 FIX: Supabase project URL (used to fetch JWKS for JWT verification).
SUPABASE_URL = "https://cwwhyufeviblebpoigqn.supabase.co"

# Secrets (set via `npx wrangler secret put <NAME>`):
# - ELEVENLABS_API_KEY — the sk_ API key for ElevenLabs
# - POKE_API_KEY — Bearer token for the Poke agent endpoint
# - SUPABASE_SECRET_KEY — server-to-server Supabase key (reserved for future admin ops)
# - STRIPE_SECRET_KEY — server-to-server Stripe key (tips/payments)
# - TURNSTILE_SECRET — Cloudflare Turnstile server-side verification secret
# - PI_API_KEY — Pi Network API key for payment verification
# - PI_WALLET_ADDRESS — wallet address that receives Pi payments
